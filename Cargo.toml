[package]
name = "codensity"
version = "0.3.0"
edition = "2024"
description = "Language-independent source-code information density analysis"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LIghtJUNction/codensity"

[dependencies]
anyhow = "=1.0.104"
brotli = "=8.0.4"
clap = { version = "=4.6.4", features = ["derive"] }
flate2 = "=1.1.9"
ignore = "=0.4.25"
lzma-rust2 = { version = "=0.17.0", default-features = false, features = ["std", "encoder", "xz"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zstd = "=0.13.3"
