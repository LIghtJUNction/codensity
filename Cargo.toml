[package]
name = "codensity"
version = "0.1.0"
edition = "2024"
description = "Deterministic source-code compression density analysis"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.4", features = ["derive"] }
ignore = "=0.4.25"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
zstd = "=0.13.3"
